name: Build Test ISO (PR #5123 + PR #1159)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout vyos-build
        uses: actions/checkout@v4
        with:
          repository: vyos/vyos-build
          ref: current

      - name: Checkout vyos-1x (PR #5123 — ddclient-v4)
        uses: actions/checkout@v4
        with:
          repository: indrajitr/vyos-1x
          ref: ddclient-v4
          path: vyos-1x-src

      - name: Build vyos-1x .deb AND ISO inside Docker
        run: |
          docker run --rm --privileged \
            -v "$(pwd)":/vyos \
            -w /vyos \
            vyos/vyos-build:current \
            bash -c "
              cd /vyos/vyos-1x-src && \
              dpkg-buildpackage -uc -us -b && \
              ls /vyos/*.deb && \
              cp /vyos/*.deb packages/ && \
              sudo --preserve-env ./build-vyos-image generic \
                --architecture amd64 \
                --build-by test@test.com \
                --build-type release \
                --version 1.5-test-pr5123
            "

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: vyos-test-pr5123-iso
          path: build/*.iso
          retention-days: 5
